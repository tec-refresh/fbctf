services:
  php-fpm:
    restart: always
    build:
      context: .
      dockerfile: extra/php-fpm/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      cache:
        condition: service_started
    volumes:
      - attachments:/var/www/fbctf/attachments
      - customlogos:/var/www/fbctf/src/data/customlogos
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: fbctf
      DB_USERNAME: ctf
      DB_PASSWORD: ctf
      MC_HOST: cache
      MC_PORT: "11211"
    expose:
      - "9000"

  nginx:
    restart: always
    build:
      context: .
      dockerfile: extra/nginx/Dockerfile
    depends_on:
      - php-fpm
    ports:
      - "80:80"
      - "443:443"

  mysql:
    restart: always
    build:
      context: .
      dockerfile: extra/mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fbctf
      MYSQL_USER: ctf
      MYSQL_PASSWORD: ctf
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: memcached:1.6
    restart: always
    expose:
      - "11211"

volumes:
  mysql_data:
  attachments:
  customlogos:
